# Cross-platform native build + jar assembly.
#
# Four jobs:
#   build-native-windows — mingw-w64 GCC via setup-msys2, cargo → rust_mod.dll
#   build-native-linux   — system GCC,                    cargo → librust_mod.so
#   build-native-macos   — system Clang,                  cargo → librust_mod.dylib
#   assemble-jar         — downloads all three natives, runs ./gradlew build
#                          with native tasks skipped (pre-placed artifacts)
#
# The final jar ships with all three binaries under
# assets/ferrite/natives/{windows,linux,macos}/. RustBridge.java picks
# the one matching the host OS at runtime and falls back cleanly on
# unsupported platforms.

name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      arms:
        description: 'Bench arms, "name=cmd;cmd|name2=cmd" (empty = script default)'
        required: false
        default: ''
      worldgen:
        description: 'Also run the worldgen bench (true/false)'
        required: false
        default: 'false'

jobs:
  build-native-windows:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup msys2 + mingw-w64 gcc
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: cargo build (x86_64-pc-windows-gnu)
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_AR: ar
        run: cargo build --release --target x86_64-pc-windows-gnu --manifest-path=rust/mod/Cargo.toml
      - name: upload native
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: target/x86_64-pc-windows-gnu/release/rust_mod.dll
          if-no-files-found: error

  build-native-linux:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: cargo clippy (deny-level lints gate the build)
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --release --target x86_64-unknown-linux-gnu --manifest-path=rust/mod/Cargo.toml
      - name: cargo test
        shell: bash
        run: cargo test --release --target x86_64-unknown-linux-gnu --manifest-path=rust/mod/Cargo.toml
      - name: cargo build (x86_64-unknown-linux-gnu)
        shell: bash
        run: cargo build --release --target x86_64-unknown-linux-gnu --manifest-path=rust/mod/Cargo.toml
      - name: upload native
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: target/x86_64-unknown-linux-gnu/release/librust_mod.so
          if-no-files-found: error

  build-native-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install gcc-aarch64-linux-gnu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: add aarch64 rust target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: cargo build (aarch64-unknown-linux-gnu)
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu --manifest-path=rust/mod/Cargo.toml
      - name: upload native
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/librust_mod.so
          if-no-files-found: error

  build-native-macos:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: add x86_64 rust target
        run: rustup target add x86_64-apple-darwin
      - name: cargo build (aarch64-apple-darwin)
        shell: bash
        run: cargo build --release --target aarch64-apple-darwin --manifest-path=rust/mod/Cargo.toml
      - name: cargo build (x86_64-apple-darwin)
        shell: bash
        run: cargo build --release --target x86_64-apple-darwin --manifest-path=rust/mod/Cargo.toml
      - name: lipo into universal binary
        shell: bash
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/librust_mod.dylib \
            target/x86_64-apple-darwin/release/librust_mod.dylib \
            -output target/librust_mod.dylib
          # sanity-check both slices are present
          lipo -info target/librust_mod.dylib
      - name: upload native
        uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: target/librust_mod.dylib
          if-no-files-found: error

  assemble-jar:
    needs: [build-native-windows, build-native-linux, build-native-linux-aarch64, build-native-macos]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: download windows native
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: src/main/resources/assets/ferrite/natives/windows
      - name: download linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: src/main/resources/assets/ferrite/natives/linux
      - name: download linux aarch64 native
        uses: actions/download-artifact@v4
        with:
          name: native-linux-aarch64
          path: src/main/resources/assets/ferrite/natives/linux-aarch64
      - name: download macos native
        uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: src/main/resources/assets/ferrite/natives/macos
      - name: assemble jar (skip rust build — natives already placed)
        shell: bash
        run: ./gradlew build -x buildRustLib -x copyRustDll
      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  # Boots a headless dedicated server with the mod in full and lean mode:
  # fails on mixin errors, checks cramming damage in the Overworld and the
  # Nether, and checks the lazy worldgen bootstrap. Logs are uploaded.
  server-smoke:
    needs: [build-native-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        diagnostics: ['true', 'false']
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: download linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: src/main/resources/assets/ferrite/natives/linux
      - name: dedicated server smoke test (diagnostics=${{ matrix.diagnostics }})
        shell: bash
        run: scripts/ci-server-smoke.sh -Pferrite.diagnostics=${{ matrix.diagnostics }}
      - name: upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log-diagnostics-${{ matrix.diagnostics }}
          path: |
            server-smoke.log
            run/logs/latest.log
          if-no-files-found: ignore

  # Prints javap bytecode of the vanilla methods in scripts/inspect-targets.txt
  # (runs when the head commit message contains [inspect]), for writing
  # mixins against this exact Minecraft version.
  inspect:
    if: contains(github.event.head_commit.message, '[inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: javap vanilla targets
        shell: bash
        run: scripts/ci-inspect.sh

  # Mob-heavy benchmark with Lithium loaded: /tick query MSPT across
  # interleaved A/B arms plus a JFR profile of the first arm. Runs on
  # manual dispatch or when the head commit message contains [bench].
  bench:
    needs: [build-native-linux]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bench]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: download linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: src/main/resources/assets/ferrite/natives/linux
      - name: fetch Lithium for this Minecraft version from Modrinth
        shell: bash
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          mkdir -p run/mods
          url=$(curl -fsSL "https://api.modrinth.com/v2/project/lithium/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${mc}%22%5D" \
            | python3 -c 'import json,sys; v=json.load(sys.stdin)[0]; print(v["version_number"], file=sys.stderr); print(next(f["url"] for f in v["files"] if f["primary"]))')
          curl -fsSL -o run/mods/lithium.jar "$url"
      - name: benchmark
        shell: bash
        env:
          BENCH_ARMS_INPUT: ${{ github.event.inputs.arms }}
        run: |
          if [ -n "$BENCH_ARMS_INPUT" ]; then export BENCH_ARMS="$BENCH_ARMS_INPUT"; fi
          scripts/ci-bench.sh -Pferrite.diagnostics=false \
            "-Pferrite.extraJvmArgs=-XX:FlightRecorderOptions=stackdepth=256 -Dferrite.log.monitors.on=true"
      - name: upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-report.txt
            bench-hot.txt
            bench-server.log
            run/logs/latest.log
            bench.jfr
            hot-*.txt
          if-no-files-found: ignore

  # Live chunk generation on the server's worldgen mods, on commits tagged
  # [worldgen-bench] or a manual run with worldgen=true.
  worldgen-bench:
    needs: [build-native-linux]
    if: contains(github.event.head_commit.message, '[worldgen-bench]') || (github.event_name == 'workflow_dispatch' && github.event.inputs.worldgen == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: download linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: src/main/resources/assets/ferrite/natives/linux
      - name: fetch the worldgen mods from Modrinth
        shell: bash
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          mapfile -t mods < <(grep -v '^#' scripts/worldgen-mods.txt | grep -v '^$')
          python3 scripts/modrinth-fetch.py "$mc" run/mods "${mods[@]}" | tee worldgen-mods-fetched.txt
          ls -1 run/mods
          # Undeclared library use shows up as class references; name the jars.
          for j in run/mods/*.jar; do
            if unzip -p "$j" '*.class' 2>/dev/null | grep -a -q 'com/supermartijn642/'; then
              echo "references SuperMartijn642's Core Lib: $j"
            fi
          done
      - name: worldgen benchmark
        shell: bash
        run: |
          scripts/ci-worldgen-bench.sh -Pferrite.diagnostics=false \
            "-Pferrite.extraJvmArgs=-XX:FlightRecorderOptions=stackdepth=512"
      - name: upload worldgen results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-results
          path: |
            worldgen-report.txt
            worldgen-stages.txt
            worldgen-hot.txt
            worldgen-mods-fetched.txt
            worldgen-server.log
            run/logs/latest.log
            worldgen.jfr
          if-no-files-found: ignore

  # Auto-publishes a GitHub Release when a tag matching v* is pushed.
  # Body is taken from docs/CURSEFORGE_DESCRIPTION.md at the tag's commit
  # (always describes what shipped at that version). Pre-release flag is
  # auto-set if the tag name contains "alpha" or "beta".
  #
  # Bypass: don't push a tag and this job never runs. Manual releases
  # via the web UI still work the same way.
  #
  # The Modrinth upload runs only when the repo variable
  # PUBLISH_MOD_PLATFORMS is "true" (gh variable set PUBLISH_MOD_PLATFORMS
  # --body true). Leave it unset for GitHub-only releases. Token lives in
  # the MODRINTH_TOKEN secret. CurseForge is skipped on purpose: it does
  # not accept mods that bundle native libraries.
  #
  # Each jar gets a SHA256SUMS entry attached to the release and a signed
  # build provenance attestation. Verify a download with
  #   gh attestation verify ferrite-<version>.jar --owner VoiceLessQ
  release:
    needs: assemble-jar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: checkout (need docs/CURSEFORGE_DESCRIPTION.md at tag commit)
        uses: actions/checkout@v4
      - name: download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: jars/
      - name: write SHA256SUMS
        shell: bash
        run: cd jars && sha256sum ferrite-*.jar | tee SHA256SUMS
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: jars/ferrite-*.jar
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ferrite ${{ github.ref_name }}"
          body_path: docs/CURSEFORGE_DESCRIPTION.md
          files: |
            jars/ferrite-*.jar
            jars/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          fail_on_unmatched_files: true
      - name: publish to modrinth
        if: vars.PUBLISH_MOD_PLATFORMS == 'true'
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: c2DHmFvV
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: jars/!(*-sources).jar
          name: "Ferrite ${{ github.ref_name }}"
          changelog-file: docs/CURSEFORGE_DESCRIPTION.md
          loaders: fabric
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
          fail-mode: fail
